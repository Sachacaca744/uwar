name: 1 - Preparer le projet source (a lancer UNE fois)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Telecharger le MDK Forge 1.20.1
        run: |
          curl -fsSL -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.3.0/forge-1.20.1-47.3.0-mdk.zip
          mkdir mdk
          unzip -q mdk.zip -d mdk
          chmod +x mdk/gradlew
      - name: Generer la table de correspondance des noms
        working-directory: mdk
        run: ./gradlew createMcpToSrg --no-daemon || ./gradlew build --no-daemon
      - name: Decompiler le jar avec CFR
        run: |
          curl -fsSL -o cfr.jar https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar
          java -jar cfr.jar original/uwar-1.0.0.jar --outputdir decompiled
      - name: Remapper et assembler le projet
        run: python3 tools/remap.py || python3 outils/remap.py
      - name: Enregistrer le projet dans le depot
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add project
          git commit -m "Projet source remappe" || echo "rien a enregistrer"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: projet-source
          path: project
